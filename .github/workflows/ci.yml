name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Validate skill pack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate skills manifest
        run: node scripts/validate-skills.mjs

      - name: Check update script syntax
        run: bash -n scripts/update-venice-skills.sh
